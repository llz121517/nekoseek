<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - NekoSeek</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 32px; border-radius: 12px; width: 320px; }
    h1 { font-size: 20px; margin: 0 0 24px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 16px;
            background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; }
    button { width: 100%; padding: 10px; background: #38bdf8; color: #0f172a; border: none;
             border-radius: 6px; font-weight: 600; cursor: pointer; }
    .msg { font-size: 13px; color: #f87171; min-height: 18px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>NekoSeek 登录</h1>
    <form id="loginForm">
      <label>用户名</label>
      <input name="username" required autocomplete="username" />
      <label>密码</label>
      <input name="password" type="password" required autocomplete="current-password" />
      <button type="submit">登录</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = JSON.stringify({ username: fd.get('username'), password: fd.get('password') });
      const res = await fetch('/api/v1/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body
      });
      const data = await res.json();
      const msg = document.getElementById('msg');
      if (data.code === 1) { location.href = '/'; }
      else { msg.textContent = data.msg; }
    });
  </script>
</body>
</html>
